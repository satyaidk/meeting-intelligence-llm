# pyproject.toml is the single source of truth for how this project is built,
# installed, tested and linted. See docs/guides/DEVELOPMENT.md for a walkthrough.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actiongraph"
version = "0.1.0"
description = "LLM-powered meeting intelligence: turn conversations into trackable, reviewable work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ActionGraph contributors" }]
dependencies = [
    "anthropic>=1.11",          # Official Claude SDK (LLM extraction)
    "fastapi>=0.115",           # REST API framework
    "uvicorn[standard]>=0.30",  # ASGI server that runs the FastAPI app
    "pydantic>=2.7",            # Data validation + JSON schemas for the LLM contract
    "pydantic-settings>=2.3",   # Typed configuration from env vars / .env
    "sqlalchemy>=2.0",          # Database ORM (SQLite by default)
    "python-multipart>=0.0.9",  # Needed by FastAPI for file uploads
    "typer>=0.12",              # Command-line interface
    "rich>=13",                 # Pretty terminal tables for the CLI
]

[project.optional-dependencies]
# Speech-to-text is optional because the model download is large (~150 MB+).
audio = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",  # Required by FastAPI's TestClient
    "ruff>=0.6",
]

[project.scripts]
# After `pip install -e .`, the `actiongraph` command calls actiongraph.cli:app
actiongraph = "actiongraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actiongraph = ["web/*.html", "web/*.js", "web/*.css"]

# ---------------------------------------------------------------- testing ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real Anthropic API (costs money; skipped unless ACTIONGRAPH_LIVE_TESTS=1)",
]

[tool.coverage.run]
source = ["actiongraph"]
omit = ["src/actiongraph/ingestion/speech_to_text.py"]

# ---------------------------------------------------------------- linting ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import sorting, B = common bugs,
# UP = modern Python syntax, SIM = simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",    # FastAPI's `Depends(...)` in default args is idiomatic
    "SIM905",  # we like "a b c".split() for readable word lists
]

[tool.ruff.lint.per-file-ignores]
"src/actiongraph/cli.py" = ["B006"]  # Typer uses mutable defaults for options
