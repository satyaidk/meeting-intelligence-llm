# Continuous integration: runs on every push and pull request.
# A red CI means "do not merge". Run the same commands locally before pushing.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Test
        # Live tests that call the real API are skipped automatically
        # (they need ACTIONGRAPH_LIVE_TESTS=1 and an API key).
        run: pytest --cov --cov-report=term-missing

      - name: Offline evaluation (regression guard for the baseline)
        run: actiongraph eval --provider offline
